---
- name: ec2 creation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: "ap-south-1"
    instance_type: "t3.micro"
    ami_id: "ami-0cede6fe40e6ac719" # Replace with a valid AMI ID for your region
    key_name: "9-30am-july-26"          # Replace with your existing AWS Key Pair name
    vpc_id: "vpc-0692fd49d8a0421e9" # Replace with your target VPC ID
    subnet_id: "subnet-0e8d1e031b9811e55" # Replace with your target Subnet ID

  tasks:
    - name: Create EC2 Security Group
      amazon.aws.ec2_security_group:
        name: "web-traffic-sg"
        description: "Allow SSH and HTTP inbound traffic"
        region: "{{ aws_region }}"
        vpc_id: "{{ vpc_id }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: 0.0.0.0/0
        rules_egress:
          - proto: all
            cidr_ip: 0.0.0.0/0
      register: sg_result

    - name: Launch Amazon EC2 Instance
      amazon.aws.ec2_instance:
        name: "AD-Server"
        region: "{{ aws_region }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        key_name: "{{ key_name }}"
        vpc_subnet_id: "{{ subnet_id }}"
        security_groups:
          - "{{ sg_result.group_id }}"
        network:
          assign_public_ip: true
        tags:
          Environment: Development
          ManagedBy: Ansible
      register: ec2_result

    - name: Display Instance Public IP Details
      ansible.builtin.debug:
        msg: "The instance public IP is {{ item.public_ip_address }}"
      loop: "{{ ec2_result.instances }}"
